# grafana/provisioning/dashboards/dashboards.yml
#
# Tells Grafana to load every .json dashboard dropped in this same folder on startup.
# Put soc-network-anomaly-dashboard.json right next to this file:
#   grafana/provisioning/dashboards/
#     ├── dashboards.yml                      <- this file
#     └── soc-network-anomaly-dashboard.json  <- the dashboard itself
#
# allowUiUpdates is false on purpose: the JSON file stays the single source of truth
# (it's generated by build_dashboard.py, not hand-edited), so an in-UI edit is kept
# for the current session but discarded on the next Grafana restart/reload rather
# than silently diverging from what's in Git. Flip to true if you'd rather edit live
# in Grafana and treat the file as a periodic export instead.

apiVersion: 1

providers:
  - name: SOC dashboards
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
