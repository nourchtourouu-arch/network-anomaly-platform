# ── APISIX Main Configuration ──────────────────────────────────────────────
apisix:
  node_listen: 9080
  enable_ipv6: false

  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

# ── etcd connection ────────────────────────────────────────────────────────
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30

# ── Plugins enabled ────────────────────────────────────────────────────────
plugins:
  - limit-req
  - limit-conn
  - limit-count
  - ip-restriction
  - uri-blocker
  - request-validation
  - cors
  - prometheus

# ── Plugin configuration ───────────────────────────────────────────────────
plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: "0.0.0.0"
      port: 9091